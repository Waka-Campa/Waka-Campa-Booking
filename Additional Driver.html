<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Safe Guide and Camper Van Onboarding Form</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #f5f5f5; }
</style>
</head>
<body>

<div style="max-width:500px;margin:0 auto;padding:30px;background:#fff;color:#000;box-shadow:inset 0 0 10px rgba(0,0,0,0.1);font-family:'DM Sans',Arial,sans-serif;border-radius:16px;">
  <div style="text-align:center;margin-bottom:30px;">
    <h2 style="margin:0 0 10px 0;font-size:18px;"><strong>Drive Safe Guide and Camper Van Onboarding Form</strong></h2>
    <p style="margin:0;font-size:16px;">Mandatory Pre-hire Task</p>
    <div style="border-bottom:1px solid #ddd;margin:20px 0;"></div>
    <img src="https://storage.googleapis.com/msgsndr/va82O7V3l50t4My9T2zQ/media/5a14548a-e6a8-4544-a2d6-41d740bb697f.jpg" alt="Payment options" style="width:118px;height:118px;display:inline-block;">
  </div>

  <div id="form-section">
    <div style="margin-bottom:25px;">
      <label style="display:block;margin-bottom:5px;font-weight:bold;color:#000;text-align:center;">Please enter your email address</label>
      <input id="email-input" type="email" placeholder="e.g. name@email.com" style="width:100%;padding:12px;border:2px solid #bdbdbd;background:#e0e0e0;color:#000;border-radius:8px;font-size:16px;">
    </div>

    <button id="verify-btn" type="button" style="width:100%;padding:15px;background:radial-gradient(circle 300px at 50% 70%, #444, #000);color:#fff;border:2px solid #fff;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;">
      Continue
    </button>
  </div>

  <div id="survey-iframe" style="display:none;width:100%;border:none;"></div>
  <div id="error" style="display:none;color:#ef4444;text-align:center;padding:20px;font-family:'DM Sans',Arial,sans-serif;"></div>
</div>

<script>
let currentEmail = '';

document.getElementById('verify-btn').onclick = function(e) {
  e.preventDefault();

  currentEmail = document.getElementById('email-input').value.trim();

  if (!currentEmail || !currentEmail.includes('@')) {
    document.getElementById('error').innerHTML = 'Please enter a valid email address';
    document.getElementById('error').style.display = 'block';
    return;
  }

  document.getElementById('error').style.display = 'none';
  document.getElementById('form-section').style.display = 'none';

  const cacheBuster = Date.now();
  const surveyUrl = `https://api.leadconnectorhq.com/widget/survey/Z72YgsQdLM9n2lfu6DTD?email=${encodeURIComponent(currentEmail)}&t=${cacheBuster}`;

  const iframe = document.createElement('iframe');
  iframe.src = surveyUrl;
  iframe.style.border = 'none';
  iframe.style.width = '100%';
  iframe.style.height = '600px';
  iframe.style.display = 'block';
  iframe.scrolling = 'no';
  iframe.id = 'Z72YgsQdLM9n2lfu6DTD';
  iframe.title = 'survey';

  document.getElementById('survey-iframe').innerHTML = '';
  document.getElementById('survey-iframe').appendChild(iframe);
  document.getElementById('survey-iframe').style.display = 'block';

  if (!document.querySelector('script[src*="form_embed.js"]')) {
    const script = document.createElement('script');
    script.src = `https://link.msgsndr.com/js/form_embed.js?t=${cacheBuster}`;
    document.head.appendChild(script);
  }
};
</script>

</body>
</html>
