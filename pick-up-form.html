<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick-up Form</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #f5f5f5; }
</style>
</head>
<body>

<div style="max-width:650PX;margin:0 auto;padding:30px;background:#fff;color:#000;box-shadow:inset 0 0 10px rgba(0,0,0,0.1);font-family:'DM Sans',Arial,sans-serif;border-radius:16px;">
  <div style="text-align:center;margin-bottom:30px;">
    <h2 style="margin:0 0 10px 0;font-size:18px;"><strong>Pick-up Form</strong></h2>
    <div style="border-bottom:1px solid #ddd;margin:20px 0;"></div>
    <img src="https://storage.googleapis.com/msgsndr/va82O7V3l50t4My9T2zQ/media/5a14548a-e6a8-4544-a2d6-41d740bb697f.jpg" alt="Payment options" style="width:118px;height:118px;display:inline-block;">
  </div>

  <div id="form-section">
    <div style="margin-bottom:20px;">
      <label style="display:block;margin-bottom:5px;font-weight:bold;color:#000;text-align:center;">Please enter reservation details</label>
      <label style="display:block;margin-bottom:5px;color:#000;">Booking Number</label>
      <input id="booking-input" type="text" placeholder="e.g. 1234" inputmode="numeric" pattern="[0-9]*" style="width:100%;padding:12px;border:2px solid #bdbdbd;background:#e0e0e0;color:#000;border-radius:8px;font-size:16px;">
    </div>

    <div style="margin-bottom:25px;">
      <label style="display:block;margin-bottom:5px;color:#000;">Last Name</label>
      <input id="lastname-input" type="text" placeholder="e.g. Smith" style="width:100%;padding:12px;border:2px solid #bdbdbd;background:#e0e0e0;color:#000;border-radius:8px;font-size:16px;">
    </div>

    <button id="verify-btn" type="button" style="width:100%;padding:15px;background:radial-gradient(circle 300px at 50% 70%, #444, #000);color:#fff;border:2px solid #fff;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;">
      Continue
    </button>
  </div>

  <div id="loading" style="display:none;padding:20px;text-align:center;color:#000;font-family:'DM Sans',Arial,sans-serif;">🔍 Searching Reservation....</div>
  <div id="booking-details" style="display:none;font-family:'DM Sans',Arial,sans-serif;"></div>
  <div id="confirmation-buttons" style="display:none;padding:20px;text-align:center;font-family:'DM Sans',Arial,sans-serif;"></div>
  <div id="survey-iframe" style="display:none;width:100%;border:none;"></div>
  <div id="thank-you-message" style="display:none;padding:30px;text-align:center;font-family:'DM Sans',Arial,sans-serif;"></div>
  <div id="error" style="display:none;color:#ef4444;text-align:center;padding:20px;font-family:'DM Sans',Arial,sans-serif;"></div>
</div>

<script>
let currentBookingNum = '';
let currentLastName = '';
let currentEmail = '';

// ===========================================================================
// RESUMING AFTER AN INTERRUPTION.  Added 6 October 2026.
//
// WHY THIS EXISTS. Everything about the customer's booking lived in the three variables above
// and was written nowhere else. One reload and it was all gone - the page fell back to
// "Please enter reservation details" and the survey iframe was destroyed with whatever the
// customer had already filled in.
//
// That is not a rare event here. On iOS, opening the camera from a file input routinely causes
// Safari to evict and reload the page when the customer comes back. The drop-off form has 18
// steps and 12 photo fields, so there are a dozen chances per form for it to happen. Measured
// across 100 real submissions: 2.8 MB per photo, 17.3 MB for a typical drop-off, worst case
// 52 MB - on whatever signal exists at a depot. A dropped connection does the same thing.
//
// Proven on a simulated iPhone before this was written: verify a booking, reach the survey,
// reload -> back to the booking-number screen, localStorage and sessionStorage both empty.
// Toby Jones (booking 4574) reported exactly that, at his pick-up AND at his drop-off, and has
// no completed form from either.
//
// WHAT THIS DOES. Once a booking is verified, it is remembered for 3 hours. If the page is
// reloaded or reopened in that window, the customer lands straight back on the form instead of
// the booking look-up, with a clear way to start over if it is not their booking.
//
// WHAT IT CANNOT DO. Whatever the customer typed INSIDE the GoHighLevel survey belongs to
// GoHighLevel, not to this page. Resuming returns them to the survey; it does not promise their
// earlier answers are still there. Getting them back without re-entering the booking number in
// front of a vehicle is the win.
//
// Storage is wrapped in try/catch throughout: private browsing can throw on access, and a form
// that fails because it could not save a convenience would be worse than no saving at all.
// ===========================================================================
var WAKA_RESUME_KEY = 'waka_pickup_resume';
var WAKA_RESUME_MINUTES = 180;

function wakaRemember(bookingNum, lastName, email) {
  try {
    localStorage.setItem(WAKA_RESUME_KEY, JSON.stringify({
      bookingNum: bookingNum, lastName: lastName, email: email, at: Date.now()
    }));
  } catch (e) { /* private mode - resuming is a convenience, never a requirement */ }
}

function wakaForget() {
  try { localStorage.removeItem(WAKA_RESUME_KEY); } catch (e) {}
}

function wakaRecall() {
  try {
    var raw = localStorage.getItem(WAKA_RESUME_KEY);
    if (!raw) return null;
    var v = JSON.parse(raw);
    if (!v || !v.bookingNum || !v.email) return null;
    if (Date.now() - Number(v.at || 0) > WAKA_RESUME_MINUTES * 60 * 1000) { wakaForget(); return null; }
    return v;
  } catch (e) { return null; }
}

// Shown above the form so nobody is ever trapped in somebody else's booking.
function wakaResumeBanner(bookingNum) {
  var bar = document.createElement('div');
  bar.id = 'waka-resume-bar';
  // PINNED TO THE TOP OF THE SCREEN, not placed in the page flow.
  // First version sat at the top of the document. On resume the page lands scrolled into the
  // survey, so the banner ended up 310px ABOVE the viewport - invisible, and untappable, at
  // precisely the moment a customer needs it ("this isn't my booking"). Measured on a simulated
  // iPhone: button rect y = -310 with the page scrolled to 344. 6 Oct 2026.
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
    'padding:10px 16px;background:#fff;border-bottom:1px solid #e0e0e0;' +
    'font-family:\'DM Sans\',Arial,sans-serif;font-size:15px;color:#000;' +
    'display:flex;align-items:center;justify-content:space-between;gap:12px;' +
    'box-shadow:0 2px 8px rgba(0,0,0,0.12);';
  bar.innerHTML = '<span>Continuing booking <strong>#' + String(bookingNum).replace(/[<>&]/g, '') + '</strong></span>';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Not you? Start over';
  btn.style.cssText = 'padding:8px 12px;border:1px solid #bdbdbd;background:#f5f5f5;border-radius:8px;' +
    'font-family:\'DM Sans\',Arial,sans-serif;font-size:14px;cursor:pointer;white-space:nowrap;';
  // Reset in place rather than reloading: a reload races the storage write and the customer ends
  // up looking at the same banner again.
  // Bound for BOTH click and touchend: on a touch device a tap did not always reach the onclick
  // property, so the button looked dead - which is exactly the kind of thing that sends a
  // customer back to WhatsApp. Tested on a simulated iPhone, 6 Oct 2026.
  var startOver = function (ev) {
    if (ev) { try { ev.preventDefault(); ev.stopPropagation(); } catch (e) {} }
    wakaForget();
    var b = document.getElementById('waka-resume-bar');
    if (b && b.parentNode) b.parentNode.removeChild(b);
    try { document.body.style.paddingTop = ''; window.scrollTo(0, 0); } catch (e) {}
    try { resetForm(); } catch (e) {}
    wakaForget();
  };
  btn.addEventListener('click', startOver);
  btn.addEventListener('touchend', startOver);
  bar.appendChild(btn);
  document.body.insertBefore(bar, document.body.firstChild);
  // Keep the pinned banner from covering the top of the form.
  try { document.body.style.paddingTop = (bar.offsetHeight + 12) + 'px'; } catch (e) {}
}

window.addEventListener('DOMContentLoaded', function () {
  var saved = wakaRecall();
  if (!saved) return;
  currentBookingNum = saved.bookingNum;
  currentLastName = saved.lastName || '';
  currentEmail = saved.email;
  try {
    wakaResumeBanner(saved.bookingNum);
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    handleDetailsCorrect();
  } catch (e) {
    // If anything about resuming fails, fall back to the normal booking look-up.
    wakaForget();
    try { document.getElementById('form-section').style.display = 'block'; } catch (e2) {}
  }
});


// Only allow numbers in booking input
document.getElementById('booking-input').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9]/g, '');
});

// Submit on Enter key from either input field
document.getElementById('booking-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('verify-btn').click();
});
document.getElementById('lastname-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('verify-btn').click();
});

// Helper: renders a field row only if value is non-empty and not 'N/A'
function field(label, value) {
  if (!value || String(value).trim() === '' || String(value).trim() === 'N/A') return '';
  return `<div><strong>${label}:</strong> ${value}</div>`;
}

document.getElementById('verify-btn').onclick = async function(e) {
  e.preventDefault();

  currentBookingNum = document.getElementById('booking-input').value.trim();
  currentLastName = document.getElementById('lastname-input').value.trim().toLowerCase();

  if (!currentBookingNum || !currentLastName) {
    document.getElementById('error').innerHTML = 'Please enter both fields';
    document.getElementById('error').style.display = 'block';
    document.getElementById('form-section').style.display = 'block';
    return;
  }

  document.getElementById('form-section').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  try {
    const response = await fetch('https://n8n.wakacampa.com/webhook/e4ffaa0c-c076-4d23-8b69-9ac0f8d6a6bb', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({bookingNum: currentBookingNum, lastName: currentLastName})
    });

    let result;
    if (response.status === 204) {
      result = { success: false, message: 'Booking not found' };
    } else {
      const json = await response.json();
      result = Array.isArray(json) ? json[0] : json;
    }

    if (result && result.success && result.data) {
      const data = result.data;
      currentEmail = data.hirerEmail || data.email || '';

      if (!data.bookingNum || !data.lastName || data.bookingNum.trim() === "" || data.lastName.trim() === "") {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').innerHTML = `
          <div style="font-size:18px;">
            ❌ Booking not found
            <br><small>Contact <a href="mailto:support@wakacampa.com" style="color:#0000FF;text-decoration:underline;">support@wakacampa.com</a> if you think this is correct</small>
          </div>
          <button onclick="resetForm()" style="margin-top:15px;padding:10px 20px;background:radial-gradient(circle 80px at 50% 70%, #444, #000);color:#fff;border:2px solid #fff;border-radius:6px;font-family:'DM Sans',Arial,sans-serif;">
            Try Again
          </button>
        `;
        return;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('booking-details').style.display = 'block';

      const bookingFields = [
        field('Pickup Date', formatDate(data.pickupDate)),
        field('Pickup Time', data.pickupTime),
        field('Pickup Location', data.pickupLocation),
        field('Dropoff Date', formatDate(data.dropoffDate)),
        field('Dropoff Time', data.dropoffTime),
        field('Dropoff Location', data.dropoffLocation),
        field('Total Cost', data.totalCost ? 'NZD ' + formatCurrency(data.totalCost) : ''),
        field('Balance Due', data.totalBalanceDue ? 'NZD ' + formatCurrency(data.totalBalanceDue) : '')
      ].filter(Boolean);

      const contactFields = [
        field('Hirer Full Name', data.hirerFullName),
        field('Email', data.hirerEmail || data.email),
        field('Phone', data.hirerPhone),
        field('Additional Phone', data.additionalPhone)
      ].filter(Boolean);

      let html = `
        <div style="background:#fff;color:#000;padding:30px;border-radius:20px;text-align:left;box-shadow:0 20px 40px rgba(0,0,0,0.2);font-family:'DM Sans',Arial,sans-serif;">
          <h2 style="margin:0 0 20px 0;text-align:center"><strong>Booking # ${data.bookingNum || 'N/A'}</strong></h2>
          <div style="border-bottom:1px solid #ddd;margin:0 0 20px 0;"></div>

          ${bookingFields.length ? `
          <div style="margin-bottom:20px;">
            <h4 style="margin:0 0 10px 0;font-size:18px;color:#000;text-align:left"><strong><u>Booking Details</u></strong></h4>
            <div style="display:grid;grid-template-columns:1fr;gap:8px;font-size:16px;text-align:left;">
              ${bookingFields.join('')}
            </div>
          </div>
          <div style="border-bottom:1px solid #ddd;margin:20px 0;"></div>
          ` : ''}

          ${contactFields.length ? `
          <div style="margin-bottom:20px;">
            <h4 style="margin:0 0 10px 0;font-size:18px;color:#000;text-align:left"><strong><u>Contact Details</u></strong></h4>
            <div style="display:grid;grid-template-columns:1fr;gap:8px;font-size:16px;text-align:left;">
              ${contactFields.join('')}
            </div>
          </div>
          <div style="border-bottom:1px solid #ddd;margin:20px 0;"></div>
          ` : ''}
      `;

      const hasDriverInfo = data.driverName || data.driverLicenseNumber;
      if (hasDriverInfo) {
        html += `
          <div style="margin-bottom:20px;">
            <h4 style="margin:0 0 10px 0;font-size:18px;color:#000;text-align:left"><strong><u>Driver's Information</u></strong></h4>
            <div style="display:grid;grid-template-columns:1fr;gap:8px;font-size:16px;text-align:left;">
              ${field("Driver's Full Name", data.driverName)}
              ${field("Driver's License Number", data.driverLicenseNumber)}
            </div>
          </div>
          <div style="border-bottom:1px solid #ddd;margin:20px 0;"></div>
        `;
      }

      const hasVehicleInfo = data.vehicleCategory || data.vehicleFleetNumber;
      if (hasVehicleInfo) {
        html += `
          <div style="margin-bottom:15px;">
            <h4 style="margin:0 0 10px 0;font-size:18px;color:#000;text-align:left"><strong><u>Vehicle Details</u></strong></h4>
            <div style="display:grid;grid-template-columns:1fr;gap:8px;font-size:16px;text-align:left;">
              ${field('Vehicle Type', data.vehicleCategory)}
              ${field('Vehicle Fleet Number', data.vehicleFleetNumber)}
            </div>
          </div>
          <div style="border-bottom:1px solid #ddd;margin:20px 0;"></div>
        `;
      }

      html += `</div>`;
      document.getElementById('booking-details').innerHTML = html;

      document.getElementById('confirmation-buttons').style.display = 'block';
      document.getElementById('confirmation-buttons').innerHTML = `
        <div style="display:flex; justify-content:center; gap:16px; margin-bottom:15px;">
          <button id="details-correct"
            style="flex:1; max-width:200px; padding:12px; text-align:center; background:radial-gradient(circle 80px at 50% 70%, #22c55e, #16a34a); color:#fff; border:2px solid #fff; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; font-family:'DM Sans',Arial,sans-serif;"
            onclick="handleDetailsCorrect()">
            ✓ Details are correct
          </button>
          <button id="details-incorrect"
            style="flex:1; max-width:200px; padding:12px; text-align:center; background:radial-gradient(circle 80px at 50% 70%, #ef4444, #dc2626); color:#fff; border:2px solid #fff; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; font-family:'DM Sans',Arial,sans-serif;"
            onclick="window.location.href='mailto:support@wakacampa.com?subject=Booking%20Verification%20Issue%20-%20${currentBookingNum}&body=Hi%20Support,%0A%0AI%20have%20a%20problem%20with%20booking%20#${currentBookingNum}.%0AThe%20details%20shown%20are%20incorrect.%0A%0APlease%20help.%0A%0AThanks!';">
            ✗ Details are incorrect
          </button>
        </div>
      `;

    } else {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').innerHTML = `
        <div style="font-size:18px;">
          ❌ ${result && result.message ? result.message : 'Booking not found'}
          <br><small>Contact <a href="mailto:support@wakacampa.com" style="color:#0000FF;text-decoration:underline;">support@wakacampa.com</a> if you think this is correct</small>
        </div>
        <button onclick="resetForm()" style="margin-top:15px;padding:10px 20px;background:radial-gradient(circle 80px at 50% 70%, #444, #000);color:#fff;border:2px solid #fff;border-radius:6px;font-family:'DM Sans',Arial,sans-serif;">
          Try Again
        </button>
      `;
    }
  } catch(error) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').innerHTML = `
      <div style="font-size:18px;">
        ❌ Connection error - try again
        <br><small>Or contact support</small>
      </div>
      <button onclick="resetForm()" style="margin-top:15px;padding:10px 20px;background:radial-gradient(circle 80px at 50% 70%, #444, #000);color:#fff;border:2px solid #fff;border-radius:6px;font-family:'DM Sans',Arial,sans-serif;">
        Try Again
      </button>
    `;
    console.error('Webhook error:', error);
  }
};

// ===========================================================================
// CHANGED 22 Sep 2026 - this is the only function that differs from the old file.
//
// The survey's email field is hidden and its ONLY source is the ?email= parameter
// on the iframe URL. Verified in a browser: with the parameter the field holds the
// address, without it the field is empty - and an empty one produces a submission
// with no customer attached, which is what lost four forms on 21 Sep.
//
// form_embed.js (GoHighLevel's resizer) finds iframes by the survey id and
// re-initialises them, which can re-point the frame at the bare survey URL and
// drop the parameter. It used to be removed and re-injected on every click while
// the iframe was destroyed and rebuilt. It is no longer loaded at all, the iframe
// id is no longer the survey id so nothing can claim it, and the height is set here.
// ===========================================================================
function handleDetailsCorrect() {
  document.getElementById('booking-details').style.display = 'none';
  document.getElementById('confirmation-buttons').style.display = 'none';

  // Refuse rather than open a survey that cannot identify the customer. Better to
  // send someone to support than to let them fill in a form that disappears.
  if (!currentEmail) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').innerHTML =
      '<div style="font-size:18px;">❌ We could not confirm your email for this booking' +
      '<br><small>Please contact <a href="mailto:support@wakacampa.com" style="color:#0000FF;text-decoration:underline;">support@wakacampa.com</a> so we can send your form directly</small></div>' +
      '<button onclick="resetForm()" style="margin-top:15px;padding:10px 20px;background:radial-gradient(circle 80px at 50% 70%, #444, #000);color:#fff;border:2px solid #fff;border-radius:6px;font-family:\'DM Sans\',Arial,sans-serif;">Try Again</button>';
    return;
  }

  // Remembered here, not at look-up: this is the point the customer commits to the form.
  wakaRemember(currentBookingNum, currentLastName, currentEmail);

  var surveyUrl = 'https://api.leadconnectorhq.com/widget/survey/VrgPS6LDk02RaQPNfUJY'
                + '?email=' + encodeURIComponent(currentEmail);

  var container = document.getElementById('survey-iframe');
  container.innerHTML = '';

  var iframe = document.createElement('iframe');
  iframe.src = surveyUrl;
  iframe.style.border = 'none';
  iframe.style.width = '100%';
  iframe.style.height = '2400px';   // tall enough for the whole survey; no resizer needed
  iframe.style.display = 'block';
  iframe.scrolling = 'auto';
  iframe.id = 'waka-survey-frame';  // deliberately NOT the survey id
  iframe.title = 'Pick-up form';

  container.appendChild(iframe);
  container.style.display = 'block';
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetForm() {
  wakaForget();
  var bar = document.getElementById('waka-resume-bar');
  if (bar && bar.parentNode) bar.parentNode.removeChild(bar);

  document.getElementById('form-section').style.display = 'block';
  document.getElementById('error').style.display = 'none';
  document.getElementById('booking-details').style.display = 'none';
  document.getElementById('confirmation-buttons').style.display = 'none';
  document.getElementById('survey-iframe').style.display = 'none';
  document.getElementById('thank-you-message').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  currentBookingNum = '';
  currentLastName = '';
  currentEmail = '';
}

function formatDate(dateStr) {
  if (!dateStr || dateStr === 'N/A') return 'N/A';
  const date = new Date(dateStr);
  if (isNaN(date.getTime())) return 'N/A';
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${months[date.getUTCMonth()]} ${date.getUTCDate()}, ${date.getUTCFullYear()}`;
}

function formatCurrency(amount) {
  if (!amount || amount === 'N/A') return 'N/A';
  const num = parseFloat(amount);
  if (isNaN(num)) return 'N/A';
  return new Intl.NumberFormat('en-NZ', {
    style: 'currency',
    currency: 'NZD',
    minimumFractionDigits: 2
  }).format(num);
}
</script>

</body>
</html>
